# ===================================================================
# VIT Semester Result Application Configuration
# ===================================================================

# Server Configuration
server.port=${PORT:8080}
server.servlet.context-path=/

# Application Information
spring.application.name=vit-semester-result

# ===================================================================
# MySQL Database Configuration
# ===================================================================
# Database: MySQL
# Database Name: vit_result_db
# Host: localhost
# Port: 3306
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:vit_result_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# Logging Configuration
logging.level.root=INFO
logging.level.com.vit.result=DEBUG
logging.level.org.hibernate.SQL=WARN
