<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error — VIT Semester Result</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
    <!-- Main Stylesheet -->
    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
</head>
<body>
    <div class="glow-orb orb-1"></div>

    <!-- Header Navigation -->
    <header class="navbar-wrapper">
        <nav class="navbar container">
            <a th:href="@{/}" class="brand-logo">
                <span class="brand-badge">VIT</span>
                <span class="brand-title">Semester Result</span>
            </a>
            <ul class="nav-links">
                <li><a th:href="@{/}" class="nav-link">Home</a></li>
                <li><a th:href="@{/result/new}" class="nav-link">Prepare Result</a></li>
                <li><a th:href="@{/result/all}" class="nav-link">Result History</a></li>
            </ul>
        </nav>
    </header>

    <main class="container page-section error-section">
        <div class="glass-card error-card">
            <div class="error-icon-box">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
            </div>
            <h1 class="error-title" th:text="${errorTitle != null ? errorTitle : 'An Error Occurred'}">An Error Occurred</h1>
            <p class="error-desc" th:text="${errorMessage != null ? errorMessage : 'We encountered an unexpected issue while processing your request.'}">
                We encountered an unexpected issue while processing your request.
            </p>
            <div class="error-actions">
                <a th:href="@{/result/new}" class="btn btn-primary">Return to Result Form</a>
                <a th:href="@{/}" class="btn btn-outline">Go to Homepage</a>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="container footer-content">
            <p>Web Technology Assignment • Developed for Educational Purpose Only</p>
        </div>
    </footer>
</body>
</html>
