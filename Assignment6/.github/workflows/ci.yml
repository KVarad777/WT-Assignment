name: Assignment 6 - Online Book Store CI/CD

on:
  push:
    paths:
      - 'Assignment6/**'
      - '.github/workflows/assignment-6-ci.yml'
  pull_request:
    paths:
      - 'Assignment6/**'
      - '.github/workflows/assignment-6-ci.yml'

jobs:
  build-frontend:
    name: Build & Test Frontend (React + TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Assignment6/frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: Assignment6/frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck and Build Production Bundle
        run: npm run build

  build-backend:
    name: Build & Test Backend (Spring Boot + Java 17)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Assignment6/backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build & Run Unit Tests
        run: mvn clean test -B

      - name: Package Application JAR
        run: mvn clean package -DskipTests -B

  docker-smoke-test:
    name: Validate Docker Compose & Multi-stage Containers
    runs-on: ubuntu-latest
    needs: [build-frontend, build-backend]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Frontend Docker Image
        run: docker build -t bookstore-frontend:test Assignment6/frontend

      - name: Build Backend Docker Image
        run: docker build -t bookstore-backend:test Assignment6/backend
