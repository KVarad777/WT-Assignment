server:
  port: ${PORT:8080}

spring:
  application:
    name: online-bookstore-backend
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/online_bookstore}
      auto-index-creation: true
  jackson:
    serialization:
      write-dates-as-timestamps: false

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: 86400000 # 24 hours
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:80}

logging:
  level:
    root: INFO
    com.bookstore: DEBUG
    org.springframework.data.mongodb.core.MongoTemplate: INFO
